name: Discovery public currentness watch

on:
  pull_request:
    paths:
      - "experiments/public_blob_index_v1/**"
      - "portfolio/PORTFOLIO_CENSUS_V1.json"
      - "tools/check_public_currentness.py"
      - "tests/test_public_currentness_watch.py"
      - ".github/workflows/discovery-public-currentness.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  public-currentness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compare live public portfolio with Discovery evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python tools/check_public_currentness.py --output public-currentness.json
          code=$?
          set -e

          if [[ -f public-currentness.json ]]; then
            cat public-currentness.json
            {
              echo "### Discovery public currentness"
              echo '~~~json'
              cat public-currentness.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Public currentness acquisition failed before a report was written."               | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          exit "$code"
