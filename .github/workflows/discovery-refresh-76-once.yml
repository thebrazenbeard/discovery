name: Discovery one-shot 57-public evidence refresh

on:
  push:
    branches:
      - portfolio/full-census-76-v1-20260930
    paths:
      - ".github/workflows/discovery-refresh-76-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact refresh branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: portfolio/full-census-76-v1-20260930
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Reproduce live 57-public blob evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/refresh_public_blob_evidence.py \
            --accept-set-change \
            --write \
            --observed-date 2026-09-30
          git diff --check
          git status --short

      - name: Commit generated evidence to the same branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            experiments/PUBLIC_BLOB_OVERLAP_SCAN_V1.json \
            experiments/public_blob_index_v1/SHARD_A.json \
            experiments/public_blob_index_v1/SHARD_B.json
          if git diff --cached --quiet; then
            echo "No generated evidence changed; refusing a false refresh." >&2
            exit 1
          fi
          git config user.name "discovery-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live 57-public blob evidence"
          git push origin HEAD:portfolio/full-census-76-v1-20260930
